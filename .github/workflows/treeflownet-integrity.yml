name: TreeFlowNet integrity controls
on:
  pull_request:
    paths:
      - 'crown_segmentation_research/clean_benchmark/**'
      - 'crown_segmentation_research/methods/**'
      - 'crown_segmentation_research/benchmark*.py'
      - 'crown_segmentation_research/research_integrity/a06_hardening_v2/**'
      - 'crown_segmentation_research/diagnosis_2026-10-11/fgq_revision_2026-10-13/grouping.py'
      - 'tests/**'
      - '.github/workflows/treeflownet-integrity.yml'
  push:
    paths:
      - 'crown_segmentation_research/clean_benchmark/**'
      - 'crown_segmentation_research/methods/**'
      - 'crown_segmentation_research/benchmark*.py'
      - 'crown_segmentation_research/research_integrity/a06_hardening_v2/**'
      - 'tests/**'
jobs:
  synthetic-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.4.0 torchvision==0.19.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==1.26.4 scipy==1.17.1 pycocotools==2.0.11 Pillow==12.2.0 pyarrow==24.0.0 shapely==2.1.2 pyproj==3.7.2 scikit-learn==1.9.0 scikit-image==0.26.0
      - name: Production API and CLI regression (no real data or model training)
        run: python -B -m unittest crown_segmentation_research.research_integrity.a06_hardening_v2.test_primitives crown_segmentation_research.research_integrity.a06_hardening_v2.test_runtime crown_segmentation_research.research_integrity.a06_hardening_v2.test_preflight
